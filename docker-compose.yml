name: gimnasio
services:
  sitio:
    build: .
    ports:
      - "8090:80"
    networks:
      - red-publica
    environment:
      DB_HOST: ${GYM_DB_HOST}
      DB_USER: ${GYM_DB_USER}
      DB_PASSWORD: ${GYM_DB_PASSWORD}
      DB_NAME: ${GYM_DB_NAME}
    depends_on:
      datos:
        condition: service_healthy
    health_check:

