name: Pipeline de revisión - Práctica Gimnasio

on:
  push:
  workflow_dispatch:

jobs:
  revision:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar funciones de comprobación
        run: |
          cat > /tmp/funciones.sh <<'EOF'
          total_web() {
            curl -s --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8090 \
              | grep -o 'id="total">[0-9]*' | grep -o '[0-9]*$'
          }
          total_consola() {
            docker compose exec -T datos mariadb -uroot -prootgym -N -e "SELECT COUNT(*) FROM gimnasio_db.socios;"
          }
          esperar() {
            local esperado=$1 web consola
            web=$(total_web); consola=$(total_consola)
            echo "Web: $web | Consola: $consola | Esperado: $esperado"
            [ "$web" = "$esperado" ] && [ "$consola" = "$esperado" ]
          }
          estado_salud() {
            docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q $1)"
          }
          EOF

      - name: "1. Estructura del proyecto (5 pts)"
        id: p1
        run: |
          for f in docker-compose.yml Dockerfile .env app/index.php database/init.sql; do
            test -f "$f" && echo "OK  $f" || { echo "FALTA $f"; exit 1; }
          done
          test -d evidencias && echo "OK  evidencias/" || { echo "FALTA evidencias/"; exit 1; }

      - name: "2. Construcción de la imagen (5 pts)"
        id: p2
        run: docker build -t gimnasio-sitio .

      - name: "3. Compose: 3 healthchecks, depends_on, redes, volúmenes y .env (10 pts)"
        id: p3
        run: |
          docker compose config > /tmp/config.yml
          cat /tmp/config.yml
          n=$(grep -c "healthcheck:" /tmp/config.yml)
          echo "Healthchecks encontrados: $n"
          [ "$n" -ge 3 ] || { echo "Se esperaban 3 healthchecks (uno por servicio)"; exit 1; }
          grep -q "service_healthy" /tmp/config.yml || { echo "Falta depends_on con service_healthy"; exit 1; }
          grep -q "red-publica" /tmp/config.yml || { echo "Falta la red red-publica"; exit 1; }
          grep -q "red-privada" /tmp/config.yml || { echo "Falta la red red-privada"; exit 1; }
          grep -q "vol-datos" /tmp/config.yml || { echo "Falta el volumen vol-datos"; exit 1; }
          grep -q "vol-uploads" /tmp/config.yml || { echo "Falta el volumen vol-uploads"; exit 1; }
          grep -q '\${' docker-compose.yml || { echo "docker-compose.yml no usa variables del .env"; exit 1; }

      - name: "4. Levantamiento: los 3 servicios healthy (10 pts)"
        id: p4
        run: |
          docker compose up -d --build --wait
          docker compose ps
          source /tmp/funciones.sh
          echo "sitio: $(estado_salud sitio) | datos: $(estado_salud datos) | panel: $(estado_salud panel)"
          [ "$(estado_salud sitio)" = "healthy" ] && [ "$(estado_salud datos)" = "healthy" ] && [ "$(estado_salud panel)" = "healthy" ]

      - name: "5. Redes: aislamiento de la base de datos (10 pts)"
        id: p5
        run: |
          pub=$(docker network inspect gimnasio_red-publica --format '{{range .Containers}}{{.Name}} {{end}}')
          priv=$(docker network inspect gimnasio_red-privada --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "red-publica: $pub"
          echo "red-privada: $priv"
          grep -q "sitio" <<< "$pub" || { echo "sitio debe estar en red-publica"; exit 1; }
          if grep -q "datos" <<< "$pub"; then echo "datos NO debe estar en red-publica"; exit 1; fi
          if grep -q "panel" <<< "$pub"; then echo "panel NO debe estar en red-publica"; exit 1; fi
          for s in sitio datos panel; do
            grep -q "$s" <<< "$priv" || { echo "$s debe estar en red-privada"; exit 1; }
          done
          echo "Redes correctas"

      - name: "6. Web + 4 registros iniciales (10 pts)"
        id: p6
        run: |
          source /tmp/funciones.sh
          curl -s http://localhost:8090
          esperar 4

      - name: "7. Panel de administración responde (5 pts)"
        id: p7
        run: |
          salida=$(curl -s --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8081)
          echo "$salida" | head -n 5
          grep -i "adminer" <<< "$salida" > /dev/null

      - name: "8. Inserción de 3 registros por consola (10 pts)"
        id: p8
        run: |
          docker compose exec -T datos mariadb -uroot -prootgym gimnasio_db -e "
            INSERT INTO socios (nombre, plan, estado) VALUES
              ('Sofía Araya',    'Anual',      'Activo'),
              ('Benjamín Vera',  'Mensual',    'Activo'),
              ('Isidora Núñez',  'Trimestral', 'Congelado');
            SELECT * FROM socios;"

      - name: "9. Comprobación de 7 registros (5 pts)"
        id: p9
        run: |
          source /tmp/funciones.sh
          esperar 7

      - name: "10. Eliminar contenedores conservando los 2 volúmenes (10 pts)"
        id: p10
        run: |
          docker compose down
          if docker ps -a --filter "name=gimnasio" --format '{{.Names}}' | grep . ; then echo "Quedaron contenedores"; exit 1; fi
          docker volume inspect gimnasio_vol-datos > /dev/null || { echo "Falta el volumen vol-datos"; exit 1; }
          docker volume inspect gimnasio_vol-uploads > /dev/null || { echo "Falta el volumen vol-uploads"; exit 1; }
          echo "Volúmenes conservados"

      - name: "11. Persistencia después de recrear (10 pts)"
        id: p11
        run: |
          source /tmp/funciones.sh
          docker compose up -d --wait
          esperar 7

      - name: "12. Eliminar volúmenes y reinicializar desde init.sql (10 pts)"
        id: p12
        run: |
          source /tmp/funciones.sh
          docker compose down -v
          if docker volume inspect gimnasio_vol-datos > /dev/null 2>&1; then echo "vol-datos sigue existiendo"; exit 1; fi
          if docker volume inspect gimnasio_vol-uploads > /dev/null 2>&1; then echo "vol-uploads sigue existiendo"; exit 1; fi
          echo "Volúmenes eliminados"
          docker compose up -d --wait
          esperar 4

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Limpieza
        if: always()
        run: docker compose down -v

      - name: Resultado final
        if: always()
        env:
          R1: ${{ steps.p1.outcome }}
          R2: ${{ steps.p2.outcome }}
          R3: ${{ steps.p3.outcome }}
          R4: ${{ steps.p4.outcome }}
          R5: ${{ steps.p5.outcome }}
          R6: ${{ steps.p6.outcome }}
          R7: ${{ steps.p7.outcome }}
          R8: ${{ steps.p8.outcome }}
          R9: ${{ steps.p9.outcome }}
          R10: ${{ steps.p10.outcome }}
          R11: ${{ steps.p11.outcome }}
          R12: ${{ steps.p12.outcome }}
        run: |
          VERDE=$'\e[1;32m'; ROJO=$'\e[1;31m'; GRIS=$'\e[0;90m'; CIAN=$'\e[1;36m'; NC=$'\e[0m'

          nombres=(
            "Estructura del proyecto"
            "Construcción de la imagen"
            "Compose: healthchecks, depends_on, redes, volúmenes y .env"
            "Levantamiento: 3 servicios healthy"
            "Redes: aislamiento de la base de datos"
            "Web + 4 registros iniciales"
            "Panel de administración responde"
            "Inserción de 3 registros por consola"
            "Comprobación de 7 registros"
            "Eliminar contenedores conservando los 2 volúmenes"
            "Persistencia después de recrear"
            "Eliminar volúmenes y reinicializar desde init.sql"
          )
          puntos=(5 5 10 10 10 10 5 10 5 10 10 10)
          obtenido=0

          {
            echo "## Resultado de la revisión - Práctica Gimnasio"
            echo ""
            echo "| Estado | Prueba | Puntos |"
            echo "|:---:|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"

          linea="+--------+-----------+----------------------------------------------------"
          echo "$linea"
          echo "| Estado | Puntos    | Prueba"
          echo "$linea"
          for i in "${!nombres[@]}"; do
            n=$((i + 1)); var="R$n"; estado="${!var}"; pts=${puntos[$i]}
            case "$estado" in
              success) marca="${VERDE}  [✔]  ${NC}"; md="✅"; gana=$pts ;;
              failure) marca="${ROJO}  [✘]  ${NC}"; md="❌"; gana=0 ;;
              *)       marca="${GRIS}  [-]  ${NC}"; md="⏭️"; gana=0 ;;
            esac
            obtenido=$((obtenido + gana))
            printf "| %b | %2d / %2d   | %d. %s\n" "$marca" "$gana" "$pts" "$n" "${nombres[$i]}"
            echo "| $md | $n. ${nombres[$i]} | $gana / $pts |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$linea"
          echo "  Puntaje total: ${CIAN}${obtenido} / 100${NC}"

          {
            echo ""
            echo "### Puntaje total: $obtenido / 100"
          } >> "$GITHUB_STEP_SUMMARY"
